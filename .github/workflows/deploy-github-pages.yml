# Builds and deploys the Vite SPA to GitHub Pages.
#
# One-time setup in the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Shareable client URL (replace OWNER and REPO):
#   https://OWNER.github.io/REPO/presentation
#
# If this repository is USERNAME.github.io (user/org site), set VITE_BASE_PATH to /
# in the Build step env below instead of /${{ github.event.repository.name }}/

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project site: app is served from https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
