# Builds and deploys the Vite SPA to GitHub Pages.
#
# One-time setup in the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Shareable client URLs:
#   Project site:  https://OWNER.github.io/REPO/presentation
#   Org/user site: https://eluv82p2-screens.github.io/presentation  (no personal username)
#
# To drop "dixit270592." from the URL, create org "eluv82p2-screens" and run:
#   powershell -File scripts/migrate-org-pages.ps1

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Org/user site (OWNER.github.io repo) serves from domain root; project sites use /REPO/.
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
